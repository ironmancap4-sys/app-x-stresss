    #h-scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.6) 70%, rgba(0,0,0,0.75)); }
    #h-pill { position: absolute; left: 0; right: 0; top: 190px; text-align: center; }
    #h-pill span { display: inline-block; padding: 12px 30px 14px; font-size: 36px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; background: #2f5bd3; border-radius: 999px; }
    .h-title { position: absolute; left: 70px; right: 70px; bottom: 420px; text-align: center; font-weight: 900; text-transform: uppercase; line-height: 1.05; font-size: 80px; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
    .h-title span { display: inline-block; }
    .h-title em { font-style: normal; color: #ffd23f; }
    #h-q { bottom: auto; top: 640px; font-size: 96px; }

    #m-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  </style>

  <div id="root" data-composition-id="map1" data-width="1080" data-height="1920">

      <img id="mi-city" class="m-img" src="assets/maps/city.jpg" width="2048" height="1792" alt="" />
      <svg id="m-ov" width="1080" height="1920" viewBox="0 0 1080 1920">

    <div id="m-clouds">

    <h1 id="h-t1" class="h-title clip" data-start="0.2" data-duration="4.3" data-track-index="3">

      <span>Từng</span> <span>là</span> <em><span>"vùng</span> <span>đệm"</span></em> <span>đi</span> <span>ngang</span> <span>qua</span>

    <h2 id="h-t3" class="h-title clip" data-start="15.5" data-duration="2.2" data-track-index="5">

    <h2 id="h-t4" class="h-title clip" data-start="17.8" data-duration="5.0" data-track-index="6">
      <span>Vai</span> <span>trò</span> <em><span>bản</span> <span>lề</span></em>
    </h2>
    <h2 id="h-q" class="h-title clip" data-start="23.0" data-duration="5.2" data-track-index="7">
      <span>Kinh</span> <span>tế</span> <span>Vĩnh</span> <span>Long</span> <span>đã</span> <em><span>tích</span> <span>lũy</span></em> <span>được</span> <span>gì?</span>
    </h2>
    <p id="h-credit" class="clip" data-start="0" data-duration="28.2" data-track-index="8" data-layout-ignore><span>Ảnh vệ tinh: Esri, Maxar, Earthstar Geographics</span></p>
    <div id="m-flash"></div>
  </div>

  <script>
    (() => {
      const W = 1080, H = 1920, DUR = 28.2;
      const MAPS = {
        delta: { el: "#mi-delta", z: 10, x0: 206848, y0: 122112, show: [0, 0] },
        vl: { el: "#mi-vl", z: 13, x0: 1664256, y0: 987136, show: [11.7, 12.3] },
        city: { el: "#mi-city", z: 15, x0: 6662656, y0: 3953152, show: [14.1, 14.6] },
      };
      // lat/lng -> pixel thế giới Web Mercator ở mức z
      const merc = (lat, lng, z) => {
        const n = 256 * 2 ** z, r = (lat * Math.PI) / 180;
        return [((lng + 180) / 360) * n, ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n];
      };
      const P = {
        hcm: merc(10.7769, 106.7009, 10), ct: merc(10.0452, 105.7469, 10), vl: merc(10.2537, 105.9722, 10),
        ze: [207616 + 1060, 122880 + 980], zc: [207616 + 440, 122880 + 960],
      };

      // ---- Camera: tâm (lat,lng) + mức zoom Z liên tục (log-zoom). Hermite đơn điệu => vận tốc liên tục.
      const K = (t, lat, lng, Z, extra = {}) => { const [x, y] = merc(lat, lng, 10); return { t, x, y, Z, ...extra }; };
      const KEYS = [
        K(0, 10.47, 106.24, 10.30),
        K(4.5, 10.40, 106.18, 10.42),
        K(10.0, 10.42, 106.20, 10.40),
        K(15.6, 10.27, 106.02, 10.95),
        K(22.6, 10.02, 106.12, 10.22),
        K(28.2, 10.2537, 105.9722, 15.7, { carry: true }),
      ];
      const CH = ["x", "y", "Z"], TS = KEYS.map((k) => k.t);
      const slopes = (vs) => {
        const n = vs.length, dl = [], m = new Array(n).fill(0);
        for (let k = 0; k < n - 1; k++) dl[k] = (vs[k + 1] - vs[k]) / (TS[k + 1] - TS[k]);
        m[0] = dl[0]; m[n - 1] = KEYS[n - 1].carry ? dl[n - 2] : 0;
        for (let k = 1; k < n - 1; k++) m[k] = dl[k - 1] * dl[k] <= 0 ? 0 : (dl[k - 1] + dl[k]) / 2;
        for (let k = 0; k < n - 1; k++) {
          if (dl[k] === 0) { m[k] = 0; m[k + 1] = 0; continue; }
          const a = m[k] / dl[k], b = m[k + 1] / dl[k], s = a * a + b * b;
          if (s > 9) { const tau = 3 / Math.sqrt(s); m[k] = tau * a * dl[k]; m[k + 1] = tau * b * dl[k]; }
        }
        return m;
      };
      const CUR = {}; CH.forEach((c) => { const vs = KEYS.map((k) => k[c]); CUR[c] = { vs, m: slopes(vs) }; });
      const sample = (t) => {
        t = Math.min(Math.max(t, 0), DUR);
        let i = 0; while (i < TS.length - 2 && t > TS[i + 1]) i++;
        const h = TS[i + 1] - TS[i], s = (t - TS[i]) / h, s2 = s * s, s3 = s2 * s, o = {};
        CH.forEach((c) => { const { vs, m } = CUR[c];
          o[c] = (2 * s3 - 3 * s2 + 1) * vs[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * vs[i + 1] + (s3 - s2) * h * m[i + 1]; });
        return o;
      };

      const $ = (s) => document.querySelector(s);
      const imgs = Object.values(MAPS).map((m) => ({ ...m, node: $(m.el) }));
      const pins = [["#p-hcm", P.hcm], ["#p-ct", P.ct], ["#p-vl", P.vl]].map(([s, p]) => [$(s), p]);
      const rivers = [...document.querySelectorAll(".rv")].map((el) => [el, merc(+el.dataset.lat, +el.dataset.lng, 10)]);
      const zl = [[$("#z-e"), [P.ze[0] - 40, P.ze[1] - 40]], [$("#z-c"), [P.zc[0] + 70, P.zc[1] - 30]]];
      const ellE = $("#m-zone-e"), ellC = $("#m-zone-c"), route = $("#m-route"), arrE = $("#m-arr-e"), arrC = $("#m-arr-c");
      const r1 = $("#m-ring1"), r2 = $("#m-ring2"), clouds = $("#m-clouds");

      function apply(t) {
        const c = sample(t), s10 = 2 ** (c.Z - 10);
        const S = (p) => [(p[0] - c.x) * s10 + W / 2, (p[1] - c.y) * s10 + H / 2];
        imgs.forEach((m) => {
          const k = 2 ** (c.Z - m.z), x = (m.x0 / 2 ** (m.z - 10) - c.x) * s10 + W / 2, y = (m.y0 / 2 ** (m.z - 10) - c.y) * s10 + H / 2;
          m.node.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
          const [a, b] = m.show; m.node.style.opacity = b ? String(Math.min(1, Math.max(0, (c.Z - a) / (b - a)))) : "1";
        });
        pins.forEach(([el, p]) => { const [x, y] = S(p); el.style.transform = `translate(${x}px, ${y}px)`; });
        rivers.forEach(([el, p]) => { const [x, y] = S(p); el.style.transform = `translate(${x}px, ${y}px)`; });
        zl.forEach(([el, p]) => { const [x, y] = S(p); el.style.transform = `translate(${x}px, ${y}px)`; });
        const [ex, ey] = S(P.ze), [cx, cy] = S(P.zc);
        ellE.setAttribute("cx", ex); ellE.setAttribute("cy", ey); ellE.setAttribute("rx", 330 * s10); ellE.setAttribute("ry", 120 * s10);
        ellE.setAttribute("transform", `rotate(121 ${ex} ${ey})`);
        ellC.setAttribute("cx", cx); ellC.setAttribute("cy", cy); ellC.setAttribute("rx", 230 * s10); ellC.setAttribute("ry", 170 * s10);
        const [hx, hy] = S(P.hcm), [vx, vy] = S(P.vl), [tx, ty] = S(P.ct);
        route.setAttribute("d", `M${hx} ${hy} Q ${(hx + vx) / 2 + 40} ${(hy + vy) / 2 + 60}, ${vx} ${vy} T ${tx} ${ty}`);
        arrE.setAttribute("d", `M${vx + 30} ${vy + 20} Q ${(vx + ex) / 2 + 60} ${(vy + ey) / 2 - 80}, ${ex - 60} ${ey - 120}`);
        arrC.setAttribute("d", `M${vx - 30} ${vy + 20} Q ${(vx + cx) / 2 - 70} ${(vy + cy) / 2 - 40}, ${cx + 90} ${cy - 60}`);
        [r1, r2].forEach((r) => { r.setAttribute("cx", vx); r.setAttribute("cy", vy); });
        const ck = 2 ** ((c.Z - 10.3) * 2.4); // mây gần camera phóng nhanh hơn bản đồ -> parallax
        clouds.style.transform = `scale(${ck})`;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => apply(clock.t) }, 0);
      apply(0);

      const wIn = (sel, at, gap = 0.08) => tl.fromTo(`${sel} span`, { opacity: 0, filter: "blur(10px)", scale: 1.08 },
        { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.18, ease: "power4.out", stagger: gap }, at);
      const wOut = (sel, at) => tl.to(`${sel} span`, { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in", stagger: 0.03 }, at);
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, at);
      const fadeOut = (sel, at, d = 0.3) => tl.to(sel, { opacity: 0, duration: d, ease: "power1.in" }, at);

      tl.to("#m-clouds .cloud", { opacity: 0, duration: 1.4, ease: "power1.in" }, 1.6);
      tl.fromTo("#h-pill-t", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.2);
      wIn("#h-t1", 0.25, 0.08); wOut("#h-t1", 4.3);
      pop("#rv-tien span", 3.2); pop("#rv-hau span", 3.9);

      pop("#p-vl .pin-in", 4.6);
      wIn("#h-t2", 5.6, 0.08); wOut("#h-t2", 10.1);
      pop("#p-hcm .pin-in", 7.6); pop("#p-ct .pin-in", 9.6);
      tl.fromTo("#m-route", { strokeDashoffset: 110, opacity: 1 }, { strokeDashoffset: 0, duration: 2.6, ease: "power1.inOut" }, 7.4);
      fadeOut(["#m-route", "#p-hcm .pin-in", "#p-ct .pin-in", "#rv-tien span", "#rv-hau span"], 12.6, 0.5);

      // "cực tăng trưởng": 2 vòng sóng lan ra từ Vĩnh Long
      [["#m-ring1", 15.6], ["#m-ring2", 16.1]].forEach(([s, at]) =>
        tl.fromTo(s, { attr: { r: 30 }, opacity: 1 }, { attr: { r: 260 }, opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, at));
      wIn("#h-t3", 15.55, 0.1); wOut("#h-t3", 17.5);

      // "bản lề": kết nối dải ven biển phía Đông và tiểu vùng trung tâm
      wIn("#h-t4", 17.85, 0.1); wOut("#h-t4", 22.6);
      tl.fromTo("#m-zone-e", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 20.3);
      pop("#z-e span", 20.6);
      tl.fromTo("#m-arr-e", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 20.2);
      tl.fromTo("#m-zone-c", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 21.6);
      pop("#z-c span", 21.9);
      tl.fromTo("#m-arr-c", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 21.5);
      fadeOut(["#m-zone-e", "#m-zone-c", "#z-e span", "#z-c span", "#m-arr-e", "#m-arr-c", "#h-pill-t"], 23.2, 0.5);

      // câu hỏi + lặn thẳng xuống TP Vĩnh Long, kết thúc bằng zoom-blur
      wIn("#h-q", 23.0, 0.11);
      fadeOut("#p-vl .pin-in", 23.3, 0.4);
      wOut("#h-q", 27.75);
      tl.fromTo("#m-world", { scale: 1, filter: "blur(0px)" }, { scale: 1.35, filter: "blur(16px)", duration: 0.35, ease: "power3.in" }, 27.85);
      tl.fromTo("#m-flash", { opacity: 0 }, { opacity: 0.35, duration: 0.35, ease: "power2.in" }, 27.85);

      window.__timelines["map1"] = tl;
    })();
  </script>
